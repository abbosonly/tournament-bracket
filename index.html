<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIUT Football Championship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* WIUT match-card look: deep indigo ground, magenta pills, violet score blocks, white neon for the winning path */
  :root {
    --bg: #2c157d;
    --bg-deep: #22106a;
    --pill: #7d1fb0;
    --pill-hi: #a324cc;
    --pill-win: #b02ad8;
    --violet: #5431c0;
    --line: #5b43b8;
    --text: #ffffff;
    --lav: #c9b8ff;
    --muted: #9c8bd8;
    --neon: #ffffff;
    --neon-glow: rgba(214, 170, 255, .75);
    --display: 'Josefin Sans', 'Century Gothic', 'Futura', 'Trebuchet MS', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: var(--display); -webkit-font-smoothing: antialiased; }

  /* ---------- toolbar ---------- */
  #toolbar {
    position: sticky; top: env(safe-area-inset-top, 0px); left: 0; z-index: 20;
    display: flex; gap: 8px; align-items: center; justify-content: flex-end;
    padding: 10px 16px;
    background: rgba(34, 16, 106, .9);
    border-bottom: 1px solid rgba(201, 184, 255, .15);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #toolbar .hint { margin-right: auto; color: var(--muted); font-size: 14px; letter-spacing: .3px; }
  .btn {
    font: 600 13px/1 var(--display); letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--text); background: var(--violet); border: 0; border-radius: 999px;
    padding: 10px 16px 8px; cursor: pointer; white-space: nowrap;
    transition: background .15s, box-shadow .15s;
  }
  .btn:hover { background: var(--pill-hi); }
  .btn.active { background: var(--pill-win); box-shadow: 0 0 14px var(--neon-glow); }
  .btn.danger:hover { background: #c2355d; }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }

  /* ---------- scaling shell ---------- */
  #viewport { overflow-x: auto; overflow-y: hidden; padding: 0; }
  #sizer { margin: 0 auto; position: relative; }
  #stage {
    position: absolute; top: 0; left: 0;
    width: 2000px; height: 1110px;
    transform-origin: 0 0;
    background:
      radial-gradient(ellipse 700px 520px at 1000px 520px, rgba(120, 70, 230, .35), rgba(44, 21, 125, 0) 100%),
      var(--bg);
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  /* neon arcs, like the ring edges on the match cards */
  .arc { position: absolute; border-radius: 50%; border: 5px solid var(--neon); pointer-events: none;
    box-shadow: 0 0 18px var(--neon-glow), inset 0 0 18px var(--neon-glow); opacity: .5; }

  /* ---------- title + headers ---------- */
  .title-box { position: absolute; left: 572px; top: 8px; width: 856px; text-align: center; }
  .title-box img { display: block; height: 54px; width: auto; margin: 0 auto 8px; }
  .title-box h1 {
    margin: 0; font: 700 34px/1 var(--display); letter-spacing: 4px; color: var(--text);
  }
  .title-box p { margin: 5px 0 0; font: 400 14px/1 var(--display); letter-spacing: 1.5px; color: var(--lav); }
  .hdr {
    position: absolute; top: 150px; width: 176px; text-align: center;
    font: 700 12px/1 var(--display); letter-spacing: 2.2px; text-transform: uppercase; color: var(--muted);
  }
  .hdr.green { color: var(--text); }

  /* ---------- team slots ---------- */
  .slot {
    position: absolute; height: 23px; width: 150px; margin: 0;
    display: flex; align-items: center; gap: 5px; padding: 0 3px 0 8px;
    background: var(--pill); border: 0; border-radius: 999px;
    color: var(--text); font: 600 11.5px/1 var(--display); letter-spacing: .2px; text-transform: uppercase;
    text-align: left; cursor: pointer;
    transition: background .15s, box-shadow .15s, opacity .15s;
  }
  .slot.right { flex-direction: row-reverse; text-align: right; padding: 0 8px 0 3px; }
  .slot .seed { flex: none; width: 14px; text-align: center; font: 600 9px/1 var(--display); color: var(--lav); opacity: .8; }
  .slot .name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-top: 2px; }
  .slot .score {
    flex: none; min-width: 22px; height: 17px; padding: 3px 5px 0; border-radius: 999px;
    background: var(--violet); text-align: center; font: 700 11px/14px var(--display);
    font-variant-numeric: tabular-nums; color: var(--text);
  }
  .slot .score sup { margin-left: 1px; font-size: 8px; vertical-align: 3px; color: var(--lav); }
  .slot .score.td { font-size: 9px; letter-spacing: .5px; }
  .slot.empty { cursor: default; background: transparent; border: 1.5px dashed rgba(201, 184, 255, .28); }
  .slot.waiting { cursor: not-allowed; }
  .slot.locked { cursor: default; }
  .slot.lose { opacity: .38; }
  .slot.win { background: var(--pill-win); box-shadow: 0 0 10px rgba(214, 120, 255, .55); }
  .slot.hl:not(.empty) { background: var(--pill-hi); opacity: 1; box-shadow: 0 0 0 1.5px var(--neon); }
  .slot:not(.empty):not(.locked):hover { background: var(--pill-hi); opacity: 1; }
  .slot:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }

  .slot.final { width: 170px; height: 27px; font-size: 14px; }
  .slot.third { width: 144px; }

  /* edit mode */
  .slot.editing { padding: 0 6px 0 8px; cursor: text; background: var(--bg-deep); box-shadow: inset 0 0 0 1.5px var(--pill-hi); }
  .slot.editing input {
    flex: 1; min-width: 0; height: 19px; border: 0; outline: 0; background: transparent;
    color: var(--text); font: inherit; text-transform: none; text-align: inherit; padding: 0;
  }

  /* ---------- connector lines ---------- */
  .ln { position: absolute; background: var(--line); }
  .ln.gd { background: #7a63d6; }
  .ln.g { background: var(--neon); box-shadow: 0 0 6px var(--neon-glow); z-index: 1; }

  /* ---------- center ---------- */
  .champ-label {
    position: absolute; left: 880px; top: 366px; width: 240px; text-align: center;
    font: 700 22px/1 var(--display); letter-spacing: 6px; color: var(--text);
    text-shadow: 0 0 14px var(--neon-glow);
  }
  .trophy { position: absolute; left: 980px; top: 400px; width: 40px; height: 40px; }
  .champ {
    position: absolute; left: 890px; top: 456px; width: 220px; height: 56px;
    display: flex; align-items: center; justify-content: center; padding: 4px 16px 0;
    border-radius: 999px; background: var(--violet);
    font: 700 21px/1 var(--display); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text); text-align: center;
  }
  .champ span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 2px 0; }
  .champ.set { background: var(--pill-win); box-shadow: 0 0 26px var(--neon-glow); }
  .champ:not(.set)::after { content: ''; width: 40%; height: 2px; margin-top: -4px; border-radius: 2px; background: rgba(201, 184, 255, .4); }
  .third-label {
    position: absolute; left: 900px; top: 693px; width: 200px; text-align: center;
    font: 700 11px/1 var(--display); letter-spacing: 2.2px; text-transform: uppercase; color: var(--muted);
  }

  /* ---------- modal ---------- */
  #modal {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; background: rgba(15, 6, 50, .65);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #modal.open { display: flex; }
  #modal .card {
    width: min(360px, calc(100vw - 32px)); padding: 24px;
    background: var(--bg-deep); border: 1px solid rgba(201, 184, 255, .2); border-radius: 22px;
  }
  #modal h2 { margin: 0 0 8px; font: 700 18px var(--display); letter-spacing: 1px; text-transform: uppercase; }
  #modal p { margin: 0 0 18px; color: var(--lav); font-size: 15px; line-height: 1.45; }
  #modal .row { display: flex; gap: 8px; justify-content: flex-end; }
  #modal .btn.confirm { background: #c2355d; }

  @media (max-width: 700px) {
    #toolbar .hint { display: none; }
    #toolbar { justify-content: center; flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) { .slot, .btn { transition: none; } }
</style>
</head>
<body>

<div id="toolbar">
  <span class="hint" id="hint">Click a team to advance it. Click the other team to switch.</span>
  <button class="btn" id="btnEdit" type="button">Edit team names</button>
  <button class="btn" id="btnExport" type="button">Export as PNG</button>
  <button class="btn danger" id="btnReset" type="button">Reset bracket</button>
</div>

<div id="viewport"><div id="sizer"><div id="stage"></div></div></div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="card">
    <h2 id="modalTitle">Reset bracket?</h2>
    <p>All picked winners will be cleared. Official results and team names are kept.</p>
    <div class="row">
      <button class="btn" id="modalCancel" type="button">Cancel</button>
      <button class="btn confirm" id="modalOk" type="button">Reset</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  'use strict';

  /* =====================================================================
     DATA MODEL
     matches[] — one entry per match:
       { id, round, index, teamA, teamB, winner, nextMatch, nextSlot,
         loserMatch, loserSlot }
     teamA / teamB are seed indices (0‥63) into names[], or null.
     winner is 'A' | 'B' | null. Rounds 0‥5 = R64‥Final, round 6 = 3rd place.
     Within a round the first half of the indices is the left side of the
     bracket and the second half is the right side.
     ===================================================================== */

  var DEFAULT_NAMES = [
    'FC VOHA', 'CIFS4', 'Qizil Furiya', 'Joga Bonito', 'Reapers56', 'Sugdiyona', 'Emirate', 'Wiut MEN',
    'Invictus FC', 'Dagestanians', 'Chapman 2.0', 'Legacy FC', 'Fenix', 'Erkatoylar', 'ALWIUT', 'ThinkLike FC',
    'West Mahalla', 'IHT', 'Apex', 'Hot Loads', 'The Best of the Best', 'CIFS43', 'Dehqonlar', 'Gingers',
    'Ajax FC', 'Sola Sol', 'Prime United', 'Bullet', 'Batman', 'Bayern', 'Egoisto', 'Camelot',
    'La Masia', 'KIOTA', 'Uzbelas FC', 'Hayvani', 'Nozik Qalb Egalari', 'cifs34', 'CIFS 25', 'Shwerma FC',
    'Psychos', 'oo7', 'Good Fellas', 'Paris Noir', 'Gentra 1.5', 'CIFS47', 'FKB Icons', 'Uzbek Tigers',
    'ACE', 'La Scaloneta', '303 United', 'Falcons', 'Nova FC', 'Beliy Tracker', 'Uzbeks', 'CIFS42',
    'Arteta lovers', 'Zolotoy', 'Red Devils', 'CIFS22', 'Naturals', 'Lucky 13', 'Khanov Team', 'Inferno'
  ];
  // previous default names, so saved brackets pick up the corrected spelling
  var RENAMED = { 3: ['Joga Bonita'], 5: ['Sogdiyona'], 21: ['CIFS 43'], 37: ['CIFS 34'], 39: ['Shawerma FC'], 41: ['007'], 45: ['CIFS 47'], 53: ['Belty Tracker'], 55: ['CIFS 42'], 59: ['CIFS 22'] };
  var ROUND_SIZES = [32, 16, 8, 4, 2, 1];
  var FINAL = 5, THIRD = 6;
  var STORAGE_KEY = 'bracket64.v1';

  // Official results from @wiutfootball_club, keyed by Round-of-64 match id
  // (match i = seeds 2i+1 vs 2i+2). Score is [teamA, teamB] or, after a
  // penalty shoot-out, [teamA, teamB, penA, penB]. ['TD', 'A'] means team A
  // was given a technical defeat (forfeit); ['WIN', 'A'] means team A won and
  // the score is unknown. These are locked.
  var RESULTS = {
    0: [12, 0],   // FC VOHA 12–0 CIFS4
    1: [3, 0],    // Qizil Furiya 3–0 Joga Bonito
    2: [3, 1],    // Reapers56 3–1 Sugdiyona
    3: [11, 1],   // Emirate 11–1 Wiut MEN
    4: [1, 3],    // Invictus FC 1–3 Dagestanians
    5: [3, 1],    // Chapman 2.0 3–1 Legacy FC
    6: [9, 0],    // Fenix 9–0 Erkatoylar
    7: [6, 1],    // ALWIUT 6–1 ThinkLike FC
    8: [1, 5],    // West Mahalla 1–5 IHT
    9: [2, 4],    // Apex 2–4 Hot Loads
    10: [1, 2],   // The Best of the Best 1–2 CIFS43
    11: [2, 3],   // Dehqonlar 2–3 Gingers
    12: ['WIN', 'A'],   // Ajax FC beat Sola Sol
    15: ['WIN', 'A'],   // Egoisto beat Camelot
    13: ['WIN', 'B'],   // Bullet beat Prime United
    14: ['WIN', 'A'],   // Batman beat Bayern
    16: ['WIN', 'A'],   // La Masia beat KIOTA
    17: [1, 2],   // Uzbelas FC 1–2 Hayvani
    18: ['TD', 'B'],    // Nozik Qalb Egalari vs cifs34 — cifs34 technical defeat
    19: [2, 2, 5, 4],   // CIFS 25 2–2 Shwerma FC (pens 5–4)
    20: ['TD', 'A'],    // Psychos vs oo7 — Psychos technical defeat
    21: [0, 3],   // Good Fellas 0–3 Paris Noir
    22: [5, 0],   // Gentra 1.5 5–0 CIFS47
    23: [6, 1],   // FKB Icons 6–1 Uzbek Tigers
    24: [0, 8],   // ACE 0–8 La Scaloneta
    25: [1, 5],   // 303 United 1–5 Falcons
    26: [0, 0, 1, 0],   // Nova FC 0–0 Beliy Tracker (pens 1–0)
    27: [2, 2, 5, 6],   // Uzbeks 2–2 CIFS42 (pens 5–6)
    28: [1, 5],   // Arteta lovers 1–5 Zolotoy
    29: [0, 1],   // Red Devils 0–1 CIFS22
    30: [5, 0],   // Naturals 5–0 Lucky 13
    31: [2, 2, 10, 9]   // Khanov Team 2–2 Inferno (pens 10–9)
  };

  var names = DEFAULT_NAMES.slice();
  var matches = [];
  var roundStart = [];          // id of the first match in each round
  var editMode = false;

  function buildMatches() {
    matches = []; roundStart = [];
    var id = 0;
    ROUND_SIZES.forEach(function (n, r) { roundStart[r] = id; id += n; });
    var thirdId = id;
    ROUND_SIZES.forEach(function (n, r) {
      for (var i = 0; i < n; i++) {
        matches.push({
          id: roundStart[r] + i, round: r, index: i,
          teamA: r === 0 ? 2 * i : null,
          teamB: r === 0 ? 2 * i + 1 : null,
          winner: null,
          nextMatch: r < FINAL ? roundStart[r + 1] + Math.floor(i / 2) : null,
          nextSlot: r < FINAL ? (i % 2 === 0 ? 'A' : 'B') : null,
          loserMatch: r === FINAL - 1 ? thirdId : null,     // semifinal losers → 3rd place
          loserSlot: r === FINAL - 1 ? (i === 0 ? 'A' : 'B') : null
        });
      }
    });
    matches.push({
      id: thirdId, round: THIRD, index: 0, teamA: null, teamB: null, winner: null,
      nextMatch: null, nextSlot: null, loserMatch: null, loserSlot: null
    });
  }

  function applyResults() {
    Object.keys(RESULTS).forEach(function (id) {
      var m = matches[id], sc = RESULTS[id];
      m.score = sc;
      if (sc[0] === 'WIN') { m.winner = sc[1]; propagate(m); return; }
      if (sc[0] === 'TD') { m.winner = sc[1] === 'A' ? 'B' : 'A'; propagate(m); return; }
      var a = sc[0], b = sc[1];
      if (a === b && sc.length === 4) { a = sc[2]; b = sc[3]; }
      m.winner = a > b ? 'A' : 'B';
      propagate(m);
    });
  }

  function team(m, slot) { return slot === 'A' ? m.teamA : m.teamB; }
  function winnerOf(m) { return m.winner ? team(m, m.winner) : null; }
  function loserOf(m) { return m.winner ? team(m, m.winner === 'A' ? 'B' : 'A') : null; }

  // Put `value` into a slot. If the participant changed, the match result no
  // longer stands, so its winner is cleared and the change cascades onward.
  function setSlot(matchId, slot, value) {
    var m = matches[matchId];
    var key = slot === 'A' ? 'teamA' : 'teamB';
    if (m[key] === value) return;
    m[key] = value;
    m.winner = null;
    propagate(m);
  }

  function propagate(m) {
    if (m.nextMatch !== null) setSlot(m.nextMatch, m.nextSlot, winnerOf(m));
    if (m.loserMatch !== null) setSlot(m.loserMatch, m.loserSlot, loserOf(m));
  }

  // Click handler logic: pick, switch, or (clicking the winner again) un-pick.
  function pick(matchId, slot) {
    var m = matches[matchId];
    if (m.teamA === null || m.teamB === null || m.score) return false;
    m.winner = m.winner === slot ? null : slot;
    propagate(m);
    return true;
  }

  /* ---------- persistence ---------- */
  function save() {
    try {
      var winners = {};
      matches.forEach(function (m) { if (m.winner) winners[m.id] = m.winner; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ names: names, winners: winners }));
    } catch (e) { /* storage unavailable — bracket still works for this session */ }
  }

  function load() {
    buildMatches();
    applyResults();
    var data = null;
    try { data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) {}
    if (!data) return;
    if (Array.isArray(data.names) && data.names.length === 64) {
      names = data.names.map(function (n, i) {
        // names that were just the old defaults follow the current defaults
        if (typeof n !== 'string' || !n.trim() || (RENAMED[i] && RENAMED[i].indexOf(n) !== -1)) return DEFAULT_NAMES[i];
        return n;
      });
    }
    // Replay winners in id order (earlier rounds first) so slots fill up naturally.
    var w = data.winners || {};
    matches.forEach(function (m) {
      var s = w[m.id];
      if ((s === 'A' || s === 'B') && !m.score && m.teamA !== null && m.teamB !== null) { m.winner = s; propagate(m); }
    });
  }

  /* =====================================================================
     GEOMETRY (design space 2000 × 1110, scaled to the window)
     ===================================================================== */
  var W = 2000, H = 1110;
  var COL_X = 30, COL_W = 150, COL_PITCH = 176, BOX_H = 23, JOIN = 13;
  var FINAL_X = 915, FINAL_W = 170, FINAL_H = 27, FINAL_YA = 610, FINAL_YB = 642;
  var THIRD_X = 928, THIRD_YA = 722, THIRD_YB = 750;
  var CHAMP_BOTTOM = 512;

  // Y[r][k] = vertical centre of the k-th box in column r (same for both sides)
  var Y = [[]];
  for (var k = 0; k < 32; k++) Y[0][k] = 192 + Math.floor(k / 2) * 56.25 + (k % 2) * 25;
  for (var r = 1; r <= 4; r++) {
    Y[r] = [];
    for (var j = 0; j < Y[r - 1].length / 2; j++) Y[r][j] = (Y[r - 1][2 * j] + Y[r - 1][2 * j + 1]) / 2;
  }

  function slotGeom(m, slot) {
    if (m.round === THIRD) return { x: THIRD_X, y: slot === 'A' ? THIRD_YA : THIRD_YB, w: 144, h: BOX_H, right: false };
    if (m.round === FINAL) return { x: FINAL_X, y: slot === 'A' ? FINAL_YA : FINAL_YB, w: FINAL_W, h: FINAL_H, right: false };
    var half = ROUND_SIZES[m.round] / 2;
    var right = m.index >= half;
    var local = right ? m.index - half : m.index;
    var x = right ? W - COL_X - COL_W - m.round * COL_PITCH : COL_X + m.round * COL_PITCH;
    return { x: x, y: Y[m.round][2 * local + (slot === 'B' ? 1 : 0)], w: COL_W, h: BOX_H, right: right };
  }

  /* =====================================================================
     RENDERING — everything below is derived from matches[] + names[]
     ===================================================================== */
  var stage = document.getElementById('stage');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function line(x1, y1, x2, y2, cls) {
    var t = 1.5, left = Math.min(x1, x2), top = Math.min(y1, y2);
    var w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
    if (h === 0) { top -= t / 2; h = t; } else { left -= t / 2; w = t; top -= t / 2; h += t; }
    return '<div class="ln ' + (cls || '') + '" style="left:' + left + 'px;top:' + top + 'px;width:' + w + 'px;height:' + h + 'px"></div>';
  }

  function connectorHTML(m) {
    if (m.round >= FINAL) return '';
    var a = slotGeom(m, 'A'), b = slotGeom(m, 'B');
    var next = slotGeom(matches[m.nextMatch], m.nextSlot);
    var from, jx, to, ty = next.y;
    if (!a.right) { from = a.x + a.w; jx = from + JOIN; to = next.x; }
    else { from = a.x; jx = from - JOIN; to = next.x + next.w; }
    if (m.round === FINAL - 1) { jx = a.right ? 1100 : 900; }
    var base = m.round === FINAL - 1 ? 'gd' : '';
    var ca = m.winner === 'A' ? 'g' : base, cb = m.winner === 'B' ? 'g' : base, co = m.winner ? 'g' : base;
    return line(from, a.y, jx, a.y, ca) + line(jx, a.y, jx, ty, ca) +
           line(from, b.y, jx, b.y, cb) + line(jx, b.y, jx, ty, cb) +
           line(jx, ty, to, ty, co);
  }

  function slotHTML(m, slot) {
    var g = slotGeom(m, slot), t = team(m, slot);
    var cls = ['slot'];
    if (g.right) cls.push('right');
    if (m.round === FINAL) cls.push('final');
    if (m.round === THIRD) cls.push('third');
    var style = 'left:' + g.x + 'px;top:' + (g.y - g.h / 2) + 'px';
    var data = ' data-match="' + m.id + '" data-slot="' + slot + '"';

    if (t === null) {
      return '<div class="' + cls.join(' ') + ' empty" style="' + style + '"></div>';
    }
    var seed = '<span class="seed">' + (t + 1) + '</span>';
    if (editMode && m.round === 0) {
      return '<div class="' + cls.join(' ') + ' editing" style="' + style + '">' + seed +
        '<input type="text" maxlength="40" data-seed="' + t + '" value="' + esc(names[t]) + '" aria-label="Team ' + (t + 1) + ' name"></div>';
    }
    var ready = m.teamA !== null && m.teamB !== null;

  function render() {
    var html = '';
    html += '<div class="arc" style="left:760px;top:880px;width:480px;height:480px"></div>' +
      '<div class="arc" style="left:1700px;top:-400px;width:520px;height:520px"></div>';
    html += '<div class="title-box"><img src="' + LOGOS + '" alt="WIUT Sports, WIUT Wolves, DI Sport, WIUT Students\' Union" width="362" height="54">' +
      '<h1>WIUT FOOTBALL CHAMPIONSHIP</h1><p>tournament bracket</p></div>';

    var labels = ['ROUND OF 64', 'ROUND OF 32', 'ROUND OF 16', 'QUARTERFINALS', 'SEMIFINAL'];
    labels.forEach(function (label, r) {
      var lx = COL_X + r * COL_PITCH + COL_W / 2 - 88, g = r === 4 ? ' green' : '';
      html += '<div class="hdr' + g + '" style="left:' + lx + 'px">' + label + '</div>';
      html += '<div class="hdr' + g + '" style="left:' + (W - lx - 176) + 'px">' + label + '</div>';
    });
    html += '<div class="hdr green" style="left:' + (W / 2 - 88) + 'px">FINAL</div>';

    matches.forEach(function (m) { html += connectorHTML(m); });

    // champion ← final
    var fin = matches[roundStart[FINAL]], champ = winnerOf(fin);
    html += line(W / 2, CHAMP_BOTTOM, W / 2, FINAL_YA - FINAL_H / 2, champ !== null ? 'g' : 'gd');
    html += '<div class="champ-label">CHAMPION</div>' + TROPHY;
    html += '<div class="champ' + (champ !== null ? ' set' : '') + '" id="champion">' +
      (champ !== null ? '<span>' + esc(names[champ]) + '</span>' : '') + '</div>';
    html += '<div class="third-label">3RD PLACE MATCH</div>';

    matches.forEach(function (m) { html += slotHTML(m, 'A') + slotHTML(m, 'B'); });
    stage.innerHTML = html;
  }

  /* ---------- fit to window (no horizontal scroll on laptops) ---------- */
  var sizer = document.getElementById('sizer');
  function fit() {
    var availW = document.documentElement.clientWidth;
    var availH = window.innerHeight - document.getElementById('toolbar').offsetHeight;
    var sw = availW / W, sh = availH / H;
    var s = Math.min(sw, Math.max(sh, sw * 0.85));   // prefer width; shrink a little if that shows the whole bracket
    var minScale = availW < 900 ? 0.7 : 0.5;          // phones/tablets: keep text legible and scroll sideways instead
    s = Math.max(minScale, Math.min(s, 1.4));
    stage.style.transform = 'scale(' + s + ')';
    sizer.style.width = Math.ceil(W * s) + 'px';
    sizer.style.height = Math.ceil(H * s) + 'px';
  }

  /* =====================================================================
     INTERACTION
     ===================================================================== */
  stage.addEventListener('click', function (e) {
    var el = e.target.closest('button.slot');
    if (!el || editMode) return;
    if (pick(+el.dataset.match, el.dataset.slot)) { save(); render(); }
  });

  // hovering a team lights up every box that team currently occupies
  stage.addEventListener('mouseover', function (e) {
    var el = e.target.closest('button.slot');
    var seed = el ? el.dataset.seed : null;
    stage.querySelectorAll('.slot.hl').forEach(function (n) { if (n.dataset.seed !== seed) n.classList.remove('hl'); });
    if (seed !== null) stage.querySelectorAll('button.slot[data-seed="' + seed + '"]').forEach(function (n) { n.classList.add('hl'); });
  });
  stage.addEventListener('mouseleave', function () {
    stage.querySelectorAll('.slot.hl').forEach(function (n) { n.classList.remove('hl'); });
  });

  // edit mode
  var btnEdit = document.getElementById('btnEdit'), hint = document.getElementById('hint');
  function setEditMode(on) {
    editMode = on;
    btnEdit.classList.toggle('active', on);
    btnEdit.textContent = on ? 'Done editing' : 'Edit team names';
    hint.textContent = on ? 'Type new names in the Round of 64 boxes, then press Done.' :
      'Click a team to advance it. Click the other team to switch.';
    render();
  }
  btnEdit.addEventListener('click', function () { setEditMode(!editMode); });
  stage.addEventListener('input', function (e) {
    if (!e.target.matches('input[data-seed]')) return;
    var i = +e.target.dataset.seed;
    names[i] = e.target.value.trim() || DEFAULT_NAMES[i];
    save();
  });
  stage.addEventListener('keydown', function (e) {
    if (!e.target.matches('input[data-seed]')) return;
    if (e.key === 'Escape') { setEditMode(false); return; }
    if (e.key === 'Enter') {
      var inputs = Array.prototype.slice.call(stage.querySelectorAll('input[data-seed]'));
      inputs.sort(function (a, b) { return a.dataset.seed - b.dataset.seed; });
      var nxt = inputs[inputs.indexOf(e.target) + 1];
      if (nxt) { nxt.focus(); nxt.select(); } else setEditMode(false);
    }
  });

  // reset (custom confirm dialog)
  var modal = document.getElementById('modal');
  function closeModal() { modal.classList.remove('open'); }
  document.getElementById('btnReset').addEventListener('click', function () {
    modal.classList.add('open');
    document.getElementById('modalCancel').focus();
  });
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  document.getElementById('modalOk').addEventListener('click', function () {
    buildMatches(); applyResults(); save(); closeModal(); render();
  });

  // export
  function renderCanvas() {
    return html2canvas(stage, {
      scale: 2, backgroundColor: '#2c157d', width: W, height: H,
      windowWidth: W + 100, windowHeight: H + 200, scrollX: 0, scrollY: 0, logging: false,
      onclone: function (doc) {
        doc.getElementById('stage').style.transform = 'none';
        doc.getElementById('sizer').style.cssText = 'width:' + W + 'px;height:' + H + 'px;margin:0';
        doc.getElementById('viewport').style.overflow = 'visible';
        doc.getElementById('toolbar').style.display = 'none';
      }
    });
  }
  var btnExport = document.getElementById('btnExport');
  btnExport.addEventListener('click', function () {
    if (typeof html2canvas === 'undefined') { alert('PNG export needs an internet connection (html2canvas is loaded from a CDN).'); return; }
    if (editMode) setEditMode(false);
    btnExport.disabled = true; btnExport.textContent = 'Exporting…';
    var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    fontsReady.then(renderCanvas).then(function (canvas) {
      canvas.toBlob(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'tournament-bracket.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      }, 'image/png');
    }).catch(function (err) {
      console.error(err); alert('Export failed: ' + err.message);
    }).then(function () { btnExport.disabled = false; btnExport.textContent = 'Export as PNG'; });
  });

  /* ---------- boot ---------- */
  load();
  render();
  fit();
  window.addEventListener('resize', fit);

  // small debugging handle: window.bracket.matches in the console shows the model
  window.bracket = { get matches() { return matches; }, get names() { return names; }, renderCanvas: renderCanvas };
})();
</script>
