<title>WIUT Championship Predictor</title>

<style id="pred-style">
  /* Layout: logo strip + title, a mirrored knockout bracket (QF left/right, semis inside, final + champion centre) scaled to the page, then send-your-picks and the leaderboard. WIUT match-card palette, single dark look. */
  :root {
    --bg: #2c157d;
    --bg-deep: #22106a;
    --panel: #34198f;
    --pill: #7d1fb0;
    --pill-hi: #a324cc;
    --pill-win: #b02ad8;
    --violet: #5431c0;
    --line: #5b43b8;
    --text: #ffffff;
    --lav: #c9b8ff;
    --muted: #9c8bd8;
    --good: #5ee6a8;
    --bad: #ff7a9a;
    --glow: rgba(214, 170, 255, .7);
    --display: 'Josefin Sans', 'Century Gothic', 'Futura', 'Trebuchet MS', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    margin: 0; font-family: var(--display); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 18px 40px;
    background: radial-gradient(ellipse 900px 600px at 50% 0%, rgba(120, 70, 230, .35), rgba(44, 21, 125, 0) 70%), var(--bg);
  }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  header img { height: 48px; width: auto; max-width: 100%; }
  h1 { margin: 0; font-size: clamp(22px, 4vw, 34px); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; text-wrap: balance; }
  .sub { margin: 0; color: var(--lav); letter-spacing: .06em; }
  .note { margin: 0; text-align: center; color: var(--lav); font-size: 14px; }

  /* bracket stage: drawn at 1000 × 470 and scaled to the column */
  .bracket-box { overflow-x: auto; overflow-y: hidden; }
  .bracket-sizer { position: relative; margin: 0 auto; }
  .stage { position: absolute; left: 0; top: 0; width: 1000px; height: 470px; transform-origin: 0 0; }
  .hdr { position: absolute; width: 170px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .hdr.hi { color: var(--text); }
  .ln { position: absolute; background: var(--line); }
  .ln.on { background: var(--text); box-shadow: 0 0 6px var(--glow); z-index: 1; }
  .slot {
    position: absolute; width: 170px; height: 36px; margin: 0;
    display: flex; align-items: center; gap: 8px; padding: 3px 14px 0;
    font: 700 13px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--text);
    background: var(--pill); border: 0; border-radius: 999px; cursor: pointer; text-align: left;
    transition: background .15s, box-shadow .15s, opacity .15s; z-index: 2;
  }
  .slot.r { flex-direction: row-reverse; text-align: right; }
  .slot .nm { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .slot .mk { flex: none; font-size: 12px; }
  .slot:hover:not(:disabled) { background: var(--pill-hi); }
  .slot:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .slot.on { background: var(--pill-win); box-shadow: 0 0 14px var(--glow); }
  .slot.off { opacity: .42; }
  .slot.right .mk { color: var(--good); }
  .slot.wrong .mk { color: var(--bad); }
  .slot.tbd { background: transparent; border: 1.5px dashed rgba(201, 184, 255, .3); color: var(--muted); font-weight: 600; font-size: 11px; cursor: default; }
  .slot:disabled { cursor: default; }
  .champ-label { position: absolute; left: 400px; width: 200px; text-align: center; font-size: 18px; font-weight: 700; letter-spacing: .3em; text-shadow: 0 0 14px var(--glow); }
  .champ { position: absolute; left: 400px; width: 200px; height: 50px; border-radius: 999px; background: var(--violet);
    display: flex; align-items: center; justify-content: center; padding: 4px 14px 0; font-size: 18px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .champ span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .champ.set { background: var(--pill-win); box-shadow: 0 0 22px var(--glow); }
  .trophy { position: absolute; left: 482px; width: 36px; height: 36px; }

  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--bg-deep); border: 1px solid rgba(201, 184, 255, .16); border-radius: 22px; padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { margin: 0; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; }
  .card p { margin: 0; color: var(--lav); font-size: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
  input[type=text], textarea {
    font: 600 15px var(--display); color: var(--text); background: var(--violet); border: 0; border-radius: 14px; padding: 10px 14px 8px; width: 100%;
  }
  input[type=text] { border-radius: 999px; }
  textarea { resize: vertical; min-height: 84px; font-weight: 400; font-size: 14px; line-height: 1.4; }
  input::placeholder, textarea::placeholder { color: var(--lav); opacity: .7; }
  input:focus-visible, textarea:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    font: 700 13px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--text); text-decoration: none;
    background: var(--pill-win); border: 0; border-radius: 999px; padding: 11px 16px 9px; cursor: pointer; display: inline-block;
  }
  .btn.alt { background: var(--violet); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .hint { font-size: 13px; color: var(--muted); }
  .hint.ok { color: var(--good); }
  .hint.err { color: var(--bad); }

  .board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .board li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--panel); border-radius: 14px; padding: 9px 12px 7px; }
  .board .rank { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .board .who { font-weight: 700; overflow-wrap: anywhere; }
  .board .ch { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 400; overflow-wrap: anywhere; }
  .board .sc { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .board .sc small { font-size: 11px; color: var(--muted); font-weight: 400; }
  .board .x { background: transparent; border: 0; color: var(--bad); font: 700 12px var(--display); cursor: pointer; padding: 4px; }
  .empty { color: var(--muted); font-size: 14px; }
  .rules { margin: 0; padding-left: 18px; color: var(--lav); font-size: 14px; }

  .admin { border-color: rgba(255, 255, 255, .4); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row .lbl { flex: 1 1 100%; font-size: 12px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  .chip { font: 700 12px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--text); background: var(--violet); border: 0; border-radius: 999px; padding: 8px 12px 6px; cursor: pointer; }
  .chip.on { background: var(--pill-win); box-shadow: 0 0 10px var(--glow); }
  .chip:disabled { opacity: .4; cursor: default; }
  .chip:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .slot { transition: none; } }
</style>

    var res = cur().results;
    [['Quarterfinals', 10], ['Semifinal', 215], ['Semifinal', W - 215 - SW], ['Quarterfinals', W - 10 - SW]].forEach(function (h) {
      var d = el('div', 'hdr' + (h[0] === 'Semifinal' ? ' hi' : ''), h[0]); d.style.left = h[1] + 'px'; d.style.top = '40px'; stage.append(d);
    });
    var fh = el('div', 'hdr hi', 'Final'); fh.style.left = '415px'; fh.style.top = '192px'; stage.append(fh);
    var th = el('div', 'hdr', '3rd place'); th.style.left = '415px'; th.style.top = '362px'; stage.append(th);
    var cl = el('div', 'champ-label', 'CHAMPION'); cl.style.top = '18px'; stage.append(cl);
    var tr = el('img', 'trophy'); tr.alt = ''; tr.style.top = '46px';
    tr.src = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6h20v12a10 10 0 0 1-20 0V6z"/><path d="M14 10H7v3a7 7 0 0 0 7 7"/><path d="M34 10h7v3a7 7 0 0 1-7 7"/><path d="M24 28v7"/><path d="M17 42l2-7h10l2 7z"/></svg>');
    stage.append(tr);
    var ch = el('div', 'champ' + (me.picks.final ? ' set' : '')); ch.style.top = '92px';
    ch.append(el('span', null, me.picks.final || '?')); stage.append(ch);

    ['qf1', 'qf2', 'qf3', 'qf4', 'sf1', 'sf2'].forEach(function (m) {
      var p = POS[m], pair = teamsOf(m, me.picks), pick = me.picks[m], nx = NEXT[m], np = POS[nx[0]], ty = np.y[nx[1]];
      var left = p.side === 'l', from = left ? p.x + SW : p.x, jx;
      if (m === 'sf1') jx = 400; else if (m === 'sf2') jx = 600; else jx = left ? from + 17 : from - 17;
      var to = left ? np.x : np.x + SW;
      var onA = !!pick && pick === pair[0], onB = !!pick && pick === pair[1];
      stage.append(line(from, p.y[0], jx, p.y[0], onA), line(jx, p.y[0], jx, ty, onA),
        line(from, p.y[1], jx, p.y[1], onB), line(jx, p.y[1], jx, ty, onB), line(jx, ty, to, ty, !!pick));
    });

    ORDER.forEach(function (m) {
      var p = POS[m], pair = teamsOf(m, me.picks), pick = me.picks[m], r = res[m];
      pair.forEach(function (t, i) {
        var b = el('button', 'slot' + (p.side === 'r' ? ' r' : '')); b.type = 'button';
        b.style.left = p.x + 'px'; b.style.top = (p.y[i] - SH / 2) + 'px';
        if (!t) {
          b.classList.add('tbd'); b.disabled = true;
          b.append(el('span', 'nm', m === 'third' ? 'Loser of semifinal ' + (i + 1) : 'Pick earlier match'));
        } else {
          b.append(el('span', 'nm', t));
          var mk = el('span', 'mk');
          if (pick === t) {
            b.classList.add('on'); b.setAttribute('aria-pressed', 'true');
            if (r) { b.classList.add(r === t ? 'right' : 'wrong'); mk.textContent = r === t ? '+' + POINTS[m] : '✕'; }
          } else if (pick) b.classList.add('off');
          b.append(mk);
          b.title = LABEL[m] + (r ? ' · won by ' + r : isLocked(m) ? ' · picks closed' : '');
          b.disabled = isLocked(m) || !pair[0] || !pair[1];
          b.addEventListener('click', function () { choose(m, t); });
        }
        stage.append(b);
      });
    });
    fit();
  }
  function fit() {
    var box = document.getElementById('bbox'), sizer = document.getElementById('sizer'), stage = document.getElementById('stage');
    var avail = box.clientWidth || W;
    var s = Math.min(1.1, avail / W);
    if (s < 0.62) s = 0.62; // phones: keep slots tappable and scroll sideways
    document.getElementById('swipe').hidden = avail / W >= 0.62;
    stage.style.transform = 'scale(' + s + ')';
    sizer.style.width = Math.ceil(W * s) + 'px'; sizer.style.height = Math.ceil(H * s) + 'px';
  }
  function choose(m, t) {
    if (isLocked(m)) return;
    if (me.picks[m] === t) delete me.picks[m]; else me.picks[m] = t;
    prune(me.picks); keep(); renderBracket(); renderSend();
  }

  /* ---------- send ---------- */
  var nick = document.getElementById('nick');
  nick.value = me.name;
  nick.addEventListener('input', function () { me.name = cleanName(nick.value); keep(); renderSend(); });
  function message() {
    var p = me.picks, lines = ['WIUT Football Championship predictions: ' + (me.name || 'no name yet')];
    if (p.final) lines.push('Champion: ' + p.final);
    if (p.sf1 || p.sf2) lines.push('Final: ' + (p.sf1 || '?') + ' vs ' + (p.sf2 || '?'));
    lines.push('Code: ' + encode(me.name, p));
    return lines.join('\n');
  }
  function renderSend() {
    var n = ORDER.filter(function (m) { return me.picks[m]; }).length;
    document.getElementById('pickCount').textContent = n === 8 ? 'All 8 picks made.' : n + ' of 8 picks made. Finish the bracket before you send it.';
    var msg = message();
    document.getElementById('msg').value = msg;
    var ready = n === 8 && !!me.name;
    document.getElementById('copyBtn').disabled = !ready;
    var tg = document.getElementById('tgBtn');
    tg.href = 'https://t.me/share/url?url=' + encodeURIComponent(' ') + '&text=' + encodeURIComponent(msg);
    tg.setAttribute('aria-disabled', ready ? 'false' : 'true'); tg.style.opacity = ready ? '' : '.45'; tg.style.pointerEvents = ready ? '' : 'none';
    var h = document.getElementById('copyHint');
    if (!ready) { h.className = 'hint'; h.textContent = me.name ? 'Pick all 8 winners to send your bracket.' : 'Add your name and pick all 8 winners to send your bracket.'; }
    else if (h.className !== 'hint ok') { h.className = 'hint'; h.textContent = 'Send the message to the organizer. You appear on the leaderboard once they add it.'; }
  }
  document.getElementById('copyBtn').addEventListener('click', function () {
    var ta = document.getElementById('msg'), h = document.getElementById('copyHint');
    var done = function () { h.className = 'hint ok'; h.textContent = 'Copied. Paste it to the organizer on Telegram.'; };
    var fallback = function () { ta.focus(); ta.select(); h.className = 'hint'; h.textContent = 'Text selected. Copy it and send it to the organizer.'; };
    try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (e) { fallback(); }
  });

  /* ---------- leaderboard ---------- */
  function renderBoard() {
    var ol = document.getElementById('board'); ol.textContent = '';
    var d = cur();
    var rows = d.players.map(function (pl) { var p = decode(pl.code); return { pl: pl, p: p, s: score(p, d.results) }; });
    if (!rows.length) { var e = el('li', 'empty', 'No brackets on the board yet. Send yours to the organizer to be first.'); e.style.cssText = 'display:block;background:none;padding:0'; ol.append(e); return; }
    rows.sort(function (a, b) { return b.s - a.s || a.pl.name.localeCompare(b.pl.name); });
    var rank = 0, prev = null;
    rows.forEach(function (r, i) {
      if (r.s !== prev) { rank = i + 1; prev = r.s; }
      var li = el('li'), who = el('div', 'who');
      who.append(document.createTextNode(r.pl.name), el('span', 'ch', 'Champion pick: ' + (r.p.final || '—')));
      var sc = el('div', 'sc'); sc.append(document.createTextNode(String(r.s)), el('small', null, ' pts'));
      if (isAdmin) {
        var x = el('button', 'x', 'Remove'); x.type = 'button';
        x.addEventListener('click', function () { edit(function (dr) { dr.players = dr.players.filter(function (q) { return q.name !== r.pl.name; }); }); });
        var wrap = el('div', 'btns'); wrap.append(sc, x); sc = wrap;
      }
      li.append(el('span', 'rank', String(rank)), who, sc);
      ol.append(li);
    });
  }

  /* ---------- organizer ---------- */
  var adminMsg = '', adminMsgCls = 'hint';
  function edit(fn) {
    if (!draft) draft = JSON.parse(JSON.stringify(DATA));
    fn(draft); renderAll();
  }
  function renderAdmin() {
    var box = document.getElementById('admin'); box.hidden = !isAdmin;
    if (!isAdmin) return;
    var body = document.getElementById('adminBody'); body.textContent = '';
    body.style.cssText = 'display:flex;flex-direction:column;gap:14px';
    body.append(el('p', null, 'Only you see this panel. Add the codes friends send you, set results as matches finish, then publish so everyone with the link sees the new leaderboard.'));

    var imp = el('div', 'field');
    var lab = el('label', null, 'Codes from friends'); lab.htmlFor = 'codes';
    var ta = el('textarea'); ta.id = 'codes'; ta.placeholder = 'Paste one or more messages here. Each has a line starting with Code: WIUT1|';
    var row = el('div', 'btns'), add = el('button', 'btn alt', 'Add to leaderboard'); add.type = 'button';
    var mine = el('button', 'btn alt', 'Add my own bracket'); mine.type = 'button';
    var hint = el('span', adminMsgCls, adminMsg);
    add.addEventListener('click', function () {
      var found = [], re = /WIUT1\|([^|\n]{1,28})\|([12-]{8})/g, m;
      while ((m = re.exec(ta.value))) found.push({ name: cleanName(m[1]), code: m[2] });
      found = found.filter(function (f) { return f.name; });
      if (!found.length) { hint.className = 'hint err'; hint.textContent = 'No codes found. Each one looks like WIUT1|Name|12121212.'; return; }
      adminMsg = 'Added ' + found.length + (found.length === 1 ? ' bracket' : ' brackets') + '. Publish to show them.'; adminMsgCls = 'hint ok';
      edit(function (dr) {
        found.forEach(function (f) {
          dr.players = dr.players.filter(function (q) { return q.name.toLowerCase() !== f.name.toLowerCase(); });
          dr.players.push({ name: f.name, code: f.code });
        });
      });
    });
    mine.addEventListener('click', function () {
      if (!me.name || ORDER.some(function (m) { return !me.picks[m]; })) { hint.className = 'hint err'; hint.textContent = 'Add your name and all 8 picks above first.'; return; }
      var code = encode(me.name, me.picks).split('|')[2];
      adminMsg = 'Added your bracket. Publish to show it.'; adminMsgCls = 'hint ok';
      edit(function (dr) { dr.players = dr.players.filter(function (q) { return q.name.toLowerCase() !== me.name.toLowerCase(); }); dr.players.push({ name: me.name, code: code }); });
    });
    row.append(add, mine); imp.append(lab, ta, row, hint); body.append(imp);

    var locks = el('div', 'row'); locks.append(el('span', 'lbl', 'Close picks when a round kicks off'));
    [['qf', 'Quarterfinals'], ['sf', 'Semifinals'], ['final', 'Final & 3rd']].forEach(function (x) {
      var on = !!cur().locked[x[0]];
      var c = el('button', 'chip' + (on ? ' on' : ''), (on ? 'Closed: ' : 'Close ') + x[1]); c.type = 'button';
      c.addEventListener('click', function () { edit(function (dr) { dr.locked[x[0]] = !dr.locked[x[0]]; }); });
      locks.append(c);
    });
    body.append(locks);

    ORDER.forEach(function (m) {
      var pair = teamsOf(m, cur().results), r = el('div', 'row');
      r.append(el('span', 'lbl', LABEL[m] + ' winner'));
      pair.forEach(function (t) {
        var c = el('button', 'chip' + (t && cur().results[m] === t ? ' on' : ''), t || 'Not decided yet'); c.type = 'button';
        c.disabled = !pair[0] || !pair[1];
        c.addEventListener('click', function () { edit(function (dr) { if (dr.results[m] === t) delete dr.results[m]; else dr.results[m] = t; prune(dr.results); }); });
        r.append(c);
      });
      body.append(r);
    });

    var pub = el('div', 'btns'), pb = el('button', 'btn', draft ? 'Publish changes' : 'No changes to publish'); pb.type = 'button'; pb.disabled = !draft;
    var ph = el('span', 'hint', draft ? 'Unpublished changes. Friends see the old leaderboard until you publish.' : '');
    var discard = el('button', 'btn alt', 'Discard'); discard.type = 'button'; discard.hidden = !draft;
    discard.addEventListener('click', function () { draft = null; adminMsg = ''; renderAll(); });
    pb.addEventListener('click', function () {
      if (!artifactNs) { ph.className = 'hint err'; ph.textContent = 'Publishing is not available in this view. Open the page on claude.ai.'; return; }
      pb.disabled = true; ph.className = 'hint'; ph.textContent = 'Publishing…';
      artifactNs.publish(buildHtml(draft)).catch(function (e) {
        pb.disabled = false;
        if (e && e.code === 'conflict') { ph.textContent = 'A newer version was published. The page is reloading; make your change again.'; return; }
        ph.className = 'hint err';
        ph.textContent = e && (e.code === 'not_writer' || e.code === 'not_granted') ? 'This account cannot publish this page.' :
          e && e.code === 'rate_limited' ? 'Publishing too often. Wait a minute and try again.' : 'Could not publish. Try again.';
      });
    });
    pub.append(pb, discard, ph); body.append(pub);
  }
  function buildHtml(data) {
    var json = JSON.stringify(data).replace(/</g, '\\u003c');
    var sEnd = '</' + 'script>';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      PAGE_HEAD +
      '<style id="pred-style">' + document.getElementById('pred-style').textContent + '</style>\n<div id="app"></div>\n' +
      '<script type="application/json" id="pred-data">' + json + sEnd + '\n<script id="pred-main">' + document.getElementById('pred-main').textContent + sEnd +
      '</body></html>';
  }

  function renderAll() { renderBracket(); renderSend(); renderBoard(); renderAdmin(); }
  renderAll();
  window.addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  if (window.claude && window.claude.use) {
    Promise.all([window.claude.use('user'), window.claude.use('artifact')]).then(function (c) {
      artifactNs = c[1];
      if (!c[0] || !c[1]) return;
      return c[0].canEdit().then(function (ok) { isAdmin = !!ok; if (isAdmin) { renderBoard(); renderAdmin(); } });
    });
  }
})();
</script>
